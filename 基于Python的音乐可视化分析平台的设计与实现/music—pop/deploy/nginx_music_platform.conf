# Nginx 配置文件 - 音乐平台系统
# 服务器IP: 192.168.10.133

upstream music_platform {
    server 127.0.0.1:5000;
}

server {
    listen 80;
    server_name 192.168.10.133;

    # 访问日志
    access_log /var/log/nginx/music_platform_access.log;
    error_log /var/log/nginx/music_platform_error.log;

    # 最大上传文件大小
    client_max_body_size 50M;

    # 静态文件（如果有）
    location /static {
        alias /var/www/music_platform/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 代理到 Flask 应用
    location / {
        proxy_pass http://music_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 健康检查
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
