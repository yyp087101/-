{% extends 'base.html' %}
{% block title %}{{ song.name }} - 音乐平台{% endblock %}

{% block body %}
<style>
/* 覆盖 body 默认背景 */
body {
    background: #000 !important;
}

/* 全屏封面背景 - 清晰显示 */
.bg-cover-blur {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    z-index: 0;
}

/* 背景遮罩层 - 半透明黑色增加文字可读性 */
.bg-cover-blur::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
}

/* 页面内容容器 */
.player-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    z-index: 1;
}

/* 顶部栏 */
.top-bar {
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
}

/* 歌曲信息 */
.song-info {
    text-align: center;
    padding: 10px 0;
    flex-shrink: 0;
}

.song-title {
    font-size: 28px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}

.song-artist {
    font-size: 18px;
    color: rgba(255,255,255,0.7);
    margin-top: 5px;
}

/* 歌词区域 - 占据主要空间 */
.lyrics-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
    position: relative;
    padding: 0 20px;
}

.lyrics-container {
    height: 400px;
    overflow: hidden;
    position: relative;
    mask-image: linear-gradient(transparent 0%, black 25%, black 50%, black 75%, transparent 100%);
    -webkit-mask-image: linear-gradient(transparent 0%, black 25%, black 50%, black 75%, transparent 100%);
}

.lyrics-scroll {
    transition: transform 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
    padding-top: 180px;
}

.lyric-line {
    padding: 16px 20px;
    text-align: center;
    color: rgba(255,255,255,0.4);
    font-size: 20px;
    transition: all 0.4s ease;
    line-height: 1.6;
}

.lyric-line.active {
    color: #00d4ff;
    font-size: 28px;
    font-weight: bold;
    text-shadow: 0 0 20px rgba(0,212,255,0.6), 0 0 40px rgba(0,212,255,0.3);
    transform: scale(1.05);
}

.lyric-line.near {
    color: rgba(255,255,255,0.6);
    font-size: 22px;
}

/* 底部控制区 */
.bottom-controls {
    flex-shrink: 0;
    padding: 15px 30px 20px;
    background: linear-gradient(transparent, rgba(0,0,0,0.5));
}

/* 播放控制 */
.play-controls {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 10px;
}

.play-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00d4ff, #4ecdc4);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    box-shadow: 0 4px 15px rgba(0,212,255,0.4);
    transition: transform 0.2s;
}

.play-btn:hover {
    transform: scale(1.1);
}

.play-btn i {
    color: #fff;
    font-size: 18px;
}

.progress-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
}

.progress-bar {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.2);
    border-radius: 3px;
    cursor: pointer;
    position: relative;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #00d4ff, #4ecdc4);
    border-radius: 3px;
    width: 0%;
    transition: width 0.1s;
}

.time-display {
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    min-width: 90px;
    text-align: center;
}

/* 操作按钮 */
.action-btns {
    display: flex;
    gap: 15px;
    margin-left: 15px;
}

.action-btn {
    padding: 8px 16px;
    border-radius: 20px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
}

.action-btn:hover {
    background: rgba(255,255,255,0.2);
}

.action-btn.active {
    background: rgba(0,212,255,0.3);
    border-color: #00d4ff;
    color: #00d4ff;
}

/* 音频可视化器 - 底部半高 */
.visualizer-container {
    height: 60px;
    margin-top: 10px;
    border-radius: 8px;
    overflow: hidden;
    background: rgba(0,0,0,0.3);
}

#realtimeCanvas {
    width: 100%;
    height: 60px;
    display: block;
}

#realtimeVisualizer {
    width: 100%;
    height: 60px;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
}
</style>

<!-- 封面背景 -->
<div class="bg-cover-blur" id="bgCover"></div>

<!-- 播放器容器 -->
<div class="player-container">
    <!-- 顶部栏 -->
    <div class="top-bar">
        <a href="{{ url_for('user_home') }}" class="text-white/70 hover:text-white flex items-center gap-2">
            <i class="fas fa-arrow-left"></i>
            <span>返回首页</span>
        </a>
    </div>
    
    <!-- 歌曲信息 -->
    <div class="song-info">
        <div class="song-title">{{ song.name }}</div>
        <div class="song-artist">{{ song.artist }}</div>
    </div>
    
    <!-- 歌词区域 -->
    <div class="lyrics-area">
        <div class="lyrics-container">
            <div id="lyricsScroll" class="lyrics-scroll"></div>
        </div>
    </div>
    
    <!-- 底部控制区 -->
    <div class="bottom-controls">
        <div class="play-controls">
            <button class="play-btn" onclick="togglePlay()">
                <i id="playIcon" class="fas fa-play"></i>
            </button>
            
            <div class="progress-wrapper">
                <div class="progress-bar" id="progress" onclick="seek(event)">
                    <div class="progress-fill" id="progressBar"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span> / <span id="totalTime">0:00</span>
                </div>
            </div>
            
            <div class="action-btns">
                <button id="favBtn" class="action-btn" onclick="toggleFavorite()">
                    <i class="fas fa-heart mr-1"></i>收藏
                </button>
            </div>
        </div>
        
        <!-- 可视化器 -->
        <div class="visualizer-container">
            <div id="realtimeVisualizer"></div>
            <canvas id="realtimeCanvas" style="display:none;"></canvas>
        </div>
    </div>
</div>

<script>
// 使用全局音频元素（页面跳转时不中断）
const audio = window.parent.globalAudio || document.getElementById('globalAudio') || (function() {
    const a = document.createElement('audio');
    a.id = 'globalAudio';
    document.body.appendChild(a);
    window.globalAudio = a;
    return a;
})();

const playIcon = document.getElementById('playIcon');
const progressBar = document.getElementById('progressBar');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
let audioContext, analyser, source;
let isLoading = true;

const songData = {
    id: '{{ song.id }}',
    name: '{{ song.name }}',
    artist: '{{ song.artist }}',
    cover: '{{ song.cover }}'
};

// 检查是否正在播放同一首歌
const savedSong = localStorage.getItem('currentSong');
const isSameSong = savedSong && JSON.parse(savedSong).id === songData.id;

// 设置封面背景
const coverUrl = '{{ song.cover }}' || 'https://via.placeholder.com/300';
document.getElementById('bgCover').style.backgroundImage = `url(${coverUrl})`;

// 解析歌词
const lrcText = `{{ lyrics|safe }}`;
let lyrics = [];
function parseLrc(lrc) {
    const lines = lrc.split('\n');
    const result = [];
    const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
    
    for (const line of lines) {
        const match = line.match(timeRegex);
        if (match) {
            const minutes = parseInt(match[1]);
            const seconds = parseInt(match[2]);
            const ms = parseInt(match[3]);
            const time = minutes * 60 + seconds + ms / (match[3].length === 3 ? 1000 : 100);
            const text = line.replace(timeRegex, '').trim();
            if (text) {
                result.push({ time, text });
            }
        }
    }
    return result.sort((a, b) => a.time - b.time);
}

lyrics = parseLrc(lrcText);

// 渲染歌词 - 新版本
function renderLyrics() {
    const container = document.getElementById('lyricsScroll');
    container.innerHTML = '';
    
    if (lyrics.length === 0) {
        container.innerHTML = '<div class="lyric-line active">暂无歌词</div>';
        return;
    }
    
    for (let i = 0; i < lyrics.length; i++) {
        const div = document.createElement('div');
        div.className = 'lyric-line';
        div.dataset.index = i;
        div.textContent = lyrics[i].text;
        container.appendChild(div);
    }
    
    // 添加底部空白，让最后一句歌词也能滚动到中间
    for (let i = 0; i < 5; i++) {
        const spacer = document.createElement('div');
        spacer.className = 'lyric-line';
        spacer.innerHTML = '&nbsp;';
        container.appendChild(spacer);
    }
}
renderLyrics();

// 歌词同步 - 新版本：当前歌词居中，前后歌词有渐变效果
let currentLyricIndex = -1;
function syncLyrics(currentTime) {
    if (lyrics.length === 0) return;
    
    let index = -1;
    for (let i = 0; i < lyrics.length; i++) {
        if (currentTime >= lyrics[i].time) {
            index = i;
        } else {
            break;
        }
    }
    
    if (index !== currentLyricIndex && index >= 0) {
        currentLyricIndex = index;
        
        const lines = document.querySelectorAll('.lyric-line');
        lines.forEach((line, i) => {
            line.classList.remove('active', 'near');
            if (i === index) {
                line.classList.add('active');
            } else if (Math.abs(i - index) === 1) {
                line.classList.add('near');
            }
        });
        
        // 计算滚动位置，让当前歌词居中
        const scroll = document.getElementById('lyricsScroll');
        const container = document.querySelector('.lyrics-container');
        const activeLine = lines[index];
        
        if (activeLine && container) {
            const containerHeight = container.offsetHeight;
            const lineTop = activeLine.offsetTop;
            const lineHeight = activeLine.offsetHeight;
            // 让当前歌词滚动到容器中间位置
            const scrollTo = lineTop - (containerHeight / 2) + (lineHeight / 2);
            scroll.style.transform = `translateY(-${Math.max(0, scrollTo)}px)`;
        }
    }
}

// 音频播放
const songId = '{{ song.id }}';

// 设置音频属性
audio.preload = 'auto';

// 保存当前歌曲信息到localStorage（用于全局迷你播放器）
const currentSongInfo = {
    id: songId,
    name: '{{ song.name }}',
    artist: '{{ song.artist }}',
    cover: '{{ song.cover }}'
};
localStorage.setItem('currentSong', JSON.stringify(currentSongInfo));

// 格式化时间
function formatTime(seconds) {
    if (isNaN(seconds)) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
}

// 如果是同一首歌且正在播放，不重新加载
if (isSameSong && audio.src && !audio.paused) {
    // 继续播放，只同步UI状态
    isLoading = false;
    playIcon.classList.remove('fa-play');
    playIcon.classList.add('fa-pause');
    if (audio.duration) {
        totalTimeEl.textContent = formatTime(audio.duration);
        currentTimeEl.textContent = formatTime(audio.currentTime);
        progressBar.style.width = (audio.currentTime / audio.duration * 100) + '%';
    }
    syncLyrics(audio.currentTime);
    setTimeout(() => initVisualizer(), 100);
} else {
    // 新歌曲，需要加载
    fetch(`/api/play_url/${songId}`)
        .then(r => r.json())
        .then(data => {
            if (data.url) {
                audio.src = data.url;
                audio.load();
                localStorage.setItem('currentAudioUrl', data.url);
            }
        })
        .catch((e) => {
            console.error('获取播放地址失败:', e);
            const fallbackUrl = `https://music.163.com/song/media/outer/url?id=${songId}.mp3`;
            audio.src = fallbackUrl;
            localStorage.setItem('currentAudioUrl', fallbackUrl);
        });
}

audio.addEventListener('canplay', function() {
    isLoading = false;
    console.log('音频可以播放');
});

audio.addEventListener('canplaythrough', function() {
    console.log('音频可以完整播放');
});

audio.addEventListener('error', function(e) {
    console.error('音频加载失败:', e);
    isLoading = false;
});

function togglePlay() {
    if (audio.paused) {
        audio.play();
        playIcon.classList.remove('fa-play');
        playIcon.classList.add('fa-pause');
        initVisualizer();
    } else {
        audio.pause();
        playIcon.classList.remove('fa-pause');
        playIcon.classList.add('fa-play');
    }
}

function seek(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    audio.currentTime = percent * audio.duration;
}

audio.addEventListener('loadedmetadata', () => {
    totalTimeEl.textContent = formatTime(audio.duration);
});

audio.addEventListener('timeupdate', () => {
    const percent = (audio.currentTime / audio.duration) * 100;
    progressBar.style.width = percent + '%';
    currentTimeEl.textContent = formatTime(audio.currentTime);
    syncLyrics(audio.currentTime);
});

audio.addEventListener('ended', () => {
    playIcon.classList.remove('fa-pause');
    playIcon.classList.add('fa-play');
});

function initVisualizer() {
    const canvas = document.getElementById('realtimeCanvas');
    canvas.style.display = 'block';
    document.getElementById('realtimeVisualizer').style.display = 'none';
    
    canvas.width = canvas.offsetWidth * 2;
    canvas.height = 120;
    const ctx = canvas.getContext('2d');
    const barCount = 64;
    const barWidth = canvas.width / barCount;
    
    // 使用模拟数据的可视化效果（不影响音频播放）
    function draw() {
        requestAnimationFrame(draw);
        
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 根据音频播放状态生成动态效果
        const isPlaying = !audio.paused;
        
        for (let i = 0; i < barCount; i++) {
            let barHeight;
            if (isPlaying) {
                // 播放时生成随机动态效果
                const time = Date.now() / 1000;
                const wave = Math.sin(time * 3 + i * 0.3) * 0.5 + 0.5;
                const random = Math.random() * 0.3;
                barHeight = (wave + random) * canvas.height * 0.8;
            } else {
                // 暂停时显示静态低条
                barHeight = 5;
            }
            
            const gradient = ctx.createLinearGradient(0, canvas.height - barHeight, 0, canvas.height);
            gradient.addColorStop(0, '#00d4ff');
            gradient.addColorStop(1, '#4ecdc4');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(i * barWidth, canvas.height - barHeight, barWidth - 2, barHeight);
        }
    }
    draw();
}

let isFavorite = false;
fetch('/api/check_favorite/' + songData.id)
    .then(r => r.json())
    .then(data => {
        isFavorite = data.is_favorite;
        updateFavBtn();
    });

function updateFavBtn() {
    const btn = document.getElementById('favBtn');
    if (isFavorite) {
        btn.innerHTML = '<i class="fas fa-heart mr-1"></i>已收藏';
        btn.classList.add('active');
    } else {
        btn.innerHTML = '<i class="fas fa-heart mr-1"></i>收藏';
        btn.classList.remove('active');
    }
}

function toggleFavorite() {
    fetch('/api/favorite/' + songData.id, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(songData)
    })
    .then(r => r.json())
    .then(data => {
        isFavorite = data.status === 'added';
        updateFavBtn();
    });
}
</script>
{% endblock %}
