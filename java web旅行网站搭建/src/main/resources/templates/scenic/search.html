<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('景点搜索 - 畅游中国')"></head>
<body>
<nav th:replace="fragments/header :: navbar"></nav>

<div style="background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%);padding:3rem 0;color:#fff;">
    <div class="container">
        <h1 class="fw-bold"><i class="bi bi-search me-2"></i>景点搜索</h1>
        <p class="mb-0 opacity-75">按关键词搜索，找到心仪的旅行目的地</p>
    </div>
</div>

<div class="container py-4">
    <!-- 搜索栏 -->
    <div class="search-box mb-4">
        <form action="/scenic/search" method="get" class="row g-3 align-items-end">
            <div class="col-md-4">
                <label class="form-label fw-bold"><i class="bi bi-search me-1"></i>关键词</label>
                <input type="text" name="keyword" class="form-control" placeholder="输入名称或关键词" th:value="${keyword}">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold"><i class="bi bi-geo-alt me-1"></i>城市</label>
                <input type="text" name="city" class="form-control" placeholder="如：北京" th:value="${city}">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold"><i class="bi bi-tag me-1"></i>景点类型</label>
                <select name="scenicType" class="form-select">
                    <option value="">全部类型</option>
                    <option value="自然" th:selected="${scenicType == '自然'}">自然景观</option>
                    <option value="人文" th:selected="${scenicType == '人文'}">人文景观</option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary-custom w-100">
                    <i class="bi bi-search me-1"></i>搜索
                </button>
            </div>
        </form>
    </div>
    
    <!-- 搜索结果 -->
    <div th:if="${keyword != null || city != null || scenicType != null}" class="mb-3">
        <p class="text-muted">
            找到 <strong class="text-primary" th:text="${pageInfo.total}">0</strong> 个相关景点
            <span th:if="${keyword != null && keyword != ''}">，关键词：“<strong th:text="${keyword}"></strong>”</span>
        </p>
    </div>
    
    <div class="row g-4">
        <div class="col-lg-4 col-md-6" th:each="scenic : ${pageInfo.list}">
            <div class="scenic-card card">
                <div class="card-img-wrapper">
                    <img th:src="${scenic.coverImage != null ? scenic.coverImage : '/images/scenic/1.jpg'}" 
                         class="card-img-top" th:alt="${scenic.name}"
                         onerror="this.src='/images/scenic/1.jpg'">
                    <span class="card-badge" th:if="${scenic.scenicLevel != null}" th:text="${scenic.scenicLevel}"></span>
                    <span class="card-price" th:text="${scenic.ticketPrice != null && scenic.ticketPrice > 0} ? '¥' + ${scenic.ticketPrice} : '免费'"></span>
                </div>
                <div class="card-body">
                    <h5 class="card-title">
                        <a th:href="@{/scenic/detail/{id}(id=${scenic.id})}" class="text-decoration-none text-dark" th:text="${scenic.name}"></a>
                    </h5>
                    <div class="d-flex align-items-center mb-2">
                        <span class="rating-stars me-2">
                            <i class="bi bi-star-fill" th:each="i : ${#numbers.sequence(1, scenic.rating != null ? scenic.rating.intValue() : 5)}"></i>
                        </span>
                        <small class="text-muted" th:text="${scenic.rating}"></small>
                    </div>
                    <p class="card-text">
                        <i class="bi bi-geo-alt text-primary me-1"></i>
                        <span th:text="${scenic.province + ' · ' + scenic.city}"></span>
                    </p>
                    <a th:href="@{/scenic/detail/{id}(id=${scenic.id})}" class="btn btn-sm btn-outline-primary mt-1" style="border-radius:20px;">
                        查看详情 <i class="bi bi-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <div th:if="${pageInfo.list == null || pageInfo.list.isEmpty()}" class="text-center py-5">
        <i class="bi bi-search" style="font-size:4rem;color:#cbd5e1;"></i>
        <h4 class="text-muted mt-3">未找到匹配的景点</h4>
        <p class="text-muted">请尝试调整关键词或筛选条件</p>
    </div>
    
    <!-- 分页 -->
    <nav th:if="${pageInfo.pages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${pageInfo.pageNum == 1 ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/scenic/search(keyword=${keyword},city=${city},scenicType=${scenicType},pageNum=${pageInfo.pageNum - 1})}">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(1, pageInfo.pages)}" th:classappend="${i == pageInfo.pageNum ? 'active' : ''}">
                <a class="page-link" th:href="@{/scenic/search(keyword=${keyword},city=${city},scenicType=${scenicType},pageNum=${i})}" th:text="${i}"></a>
            </li>
            <li class="page-item" th:classappend="${pageInfo.pageNum == pageInfo.pages ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/scenic/search(keyword=${keyword},city=${city},scenicType=${scenicType},pageNum=${pageInfo.pageNum + 1})}">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>
</div>

<footer th:replace="fragments/header :: footer"></footer>
<div th:replace="fragments/header :: scripts"></div>
</body>
</html>
