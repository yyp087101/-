<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('热门景点 TOP10 - 畅游中国')"></head>
<body>
<nav th:replace="fragments/header :: navbar"></nav>

<div style="background:linear-gradient(135deg,#dc2626 0%,#f59e0b 100%);padding:3rem 0;color:#fff;">
    <div class="container">
        <h1 class="fw-bold"><i class="bi bi-fire me-2"></i>热门景点 TOP10</h1>
        <p class="mb-0 opacity-75">综合评分和热度排序，为您精选全国热门旅行目的地</p>
    </div>
</div>

<div class="container py-4">
    <div class="row g-4">
        <div class="col-12" th:each="scenic,iter : ${hotScenics}">
            <div class="card border-0 shadow-sm" style="border-radius:16px;overflow:hidden;">
                <div class="row g-0 align-items-center">
                    <div class="col-md-1 text-center py-3">
                        <div class="d-inline-flex align-items-center justify-content-center rounded-circle" 
                             th:classappend="${iter.index < 3 ? '' : ''}"
                             th:style="${iter.index == 0 ? 'background:linear-gradient(135deg,#fbbf24,#f59e0b);width:50px;height:50px;' : 
                                        (iter.index == 1 ? 'background:linear-gradient(135deg,#94a3b8,#64748b);width:50px;height:50px;' : 
                                        (iter.index == 2 ? 'background:linear-gradient(135deg,#d97706,#92400e);width:50px;height:50px;' : 
                                        'background:#e2e8f0;width:50px;height:50px;'))}">
                            <span class="fw-bold" th:classappend="${iter.index < 3 ? 'text-white' : 'text-muted'}" 
                                  style="font-size:1.2rem;" th:text="${iter.index + 1}"></span>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <img th:src="${scenic.coverImage != null ? scenic.coverImage : '/images/scenic/1.jpg'}" 
                             class="w-100" style="height:160px;object-fit:cover;" th:alt="${scenic.name}"
                             onerror="this.src='/images/scenic/1.jpg'">
                    </div>
                    <div class="col-md-5 p-3">
                        <h4 class="fw-bold mb-2">
                            <a th:href="@{/scenic/detail/{id}(id=${scenic.id})}" class="text-decoration-none text-dark" th:text="${scenic.name}"></a>
                        </h4>
                        <p class="text-muted mb-2" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;" 
                           th:text="${scenic.content}"></p>
                        <div class="d-flex gap-2">
                            <span class="badge bg-primary bg-opacity-10 text-primary" th:if="${scenic.scenicLevel != null}">
                                <i class="bi bi-award me-1"></i><span th:text="${scenic.scenicLevel}"></span>
                            </span>
                            <span class="badge bg-info bg-opacity-10 text-info" th:if="${scenic.scenicType != null}" th:text="${scenic.scenicType}"></span>
                            <span class="badge bg-success bg-opacity-10 text-success" th:if="${scenic.bestSeason != null}" th:text="${scenic.bestSeason}"></span>
                        </div>
                    </div>
                    <div class="col-md-3 p-3 text-end">
                        <div class="mb-2">
                            <span class="rating-stars">
                                <i class="bi bi-star-fill" th:each="i : ${#numbers.sequence(1, scenic.rating != null ? scenic.rating.intValue() : 5)}"></i>
                            </span>
                            <span class="fw-bold ms-1" th:text="${scenic.rating}"></span>
                        </div>
                        <p class="text-muted small mb-1">
                            <i class="bi bi-geo-alt me-1"></i><span th:text="${scenic.province + ' · ' + scenic.city}"></span>
                        </p>
                        <p class="small mb-2">
                            <i class="bi bi-eye me-1 text-muted"></i><span class="text-muted" th:text="${scenic.viewCount + ' 次浏览'}"></span>
                        </p>
                        <p class="fw-bold mb-2" th:classappend="${scenic.ticketPrice == 0 ? ' text-success' : ' text-danger'}"
                           th:text="${scenic.ticketPrice != null && scenic.ticketPrice > 0} ? '¥' + ${scenic.ticketPrice} : '免费'"></p>
                        <a th:href="@{/scenic/detail/{id}(id=${scenic.id})}" class="btn btn-sm btn-primary-custom">
                            查看详情 <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="fragments/header :: footer"></footer>
<div th:replace="fragments/header :: scripts"></div>
</body>
</html>
