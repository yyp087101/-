<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">旅行推荐网站</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://unpkg.com/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://unpkg.com/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Animate.css -->
    <link href="https://unpkg.com/animate.css@4.1.1/animate.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #f59e0b;
            --accent: #10b981;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --card-shadow: 0 4px 20px rgba(0,0,0,0.08);
            --card-hover-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }
        
        * { font-family: 'Noto Sans SC', sans-serif; }
        
        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 导航栏 */
        .navbar-custom {
            background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
            box-shadow: 0 2px 15px rgba(0,0,0,0.2);
            padding: 0.6rem 0;
        }
        .navbar-custom .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff !important;
            letter-spacing: 1px;
        }
        .navbar-custom .navbar-brand i {
            color: var(--secondary);
            margin-right: 8px;
        }
        .navbar-custom .nav-link {
            color: rgba(255,255,255,0.85) !important;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .navbar-custom .nav-link:hover,
        .navbar-custom .nav-link.active {
            color: #fff !important;
            background: rgba(255,255,255,0.15);
        }
        .navbar-custom .btn-login {
            background: var(--secondary);
            color: #fff;
            border: none;
            padding: 6px 20px;
            border-radius: 20px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .navbar-custom .btn-login:hover {
            background: #d97706;
            transform: translateY(-1px);
        }
        .user-avatar-nav {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--secondary);
        }
        
        /* 页脚 */
        .footer {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: rgba(255,255,255,0.7);
            padding: 2rem 0;
            margin-top: auto;
        }
        .footer a { color: var(--secondary); text-decoration: none; }
        .footer a:hover { color: #fbbf24; }
        
        /* 通用卡片样式 */
        .scenic-card {
            border: none;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%;
        }
        .scenic-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--card-hover-shadow);
        }
        .scenic-card .card-img-top {
            height: 200px;
            object-fit: cover;
            transition: transform 0.5s;
        }
        .scenic-card:hover .card-img-top {
            transform: scale(1.05);
        }
        .scenic-card .card-img-wrapper {
            overflow: hidden;
            position: relative;
        }
        .scenic-card .card-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            backdrop-filter: blur(10px);
        }
        .scenic-card .card-price {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: var(--secondary);
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .scenic-card .card-body { padding: 1.2rem; }
        .scenic-card .card-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }
        .scenic-card .card-text {
            color: var(--text-muted);
            font-size: 0.88rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* 评分星星 */
        .rating-stars { color: var(--secondary); }
        .rating-stars .bi-star-fill { margin-right: 2px; }
        
        /* 分页 */
        .pagination .page-link {
            border: none;
            color: var(--primary);
            border-radius: 8px;
            margin: 0 3px;
            padding: 8px 16px;
        }
        .pagination .page-item.active .page-link {
            background: var(--primary);
            color: #fff;
        }
        
        /* 节标题 */
        .section-title {
            position: relative;
            font-weight: 700;
            font-size: 1.6rem;
            padding-bottom: 12px;
            margin-bottom: 1.5rem;
        }
        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
        }
        .section-title.text-center::after {
            left: 50%;
            transform: translateX(-50%);
        }
        
        /* 搜索框 */
        .search-box {
            background: #fff;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--card-shadow);
        }
        .search-box .form-control, .search-box .form-select {
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            padding: 10px 16px;
        }
        .search-box .form-control:focus, .search-box .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 10px;
            padding: 10px 28px;
            font-weight: 600;
            color: #fff;
            transition: all 0.3s;
        }
        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(37,99,235,0.4);
            color: #fff;
        }

        /* 面包屑 */
        .breadcrumb-custom {
            background: transparent;
            padding: 1rem 0;
        }
        
        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        .img-placeholder {
            background: linear-gradient(135deg, #e2e8f0, #cbd5e1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 3rem;
        }
    </style>
</head>

<!-- 导航栏 -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-globe-americas"></i>畅游中国
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                style="border-color: rgba(255,255,255,0.3);">
            <span class="navbar-toggler-icon" style="filter: brightness(2);"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house-door me-1"></i>首页</a></li>
                <li class="nav-item"><a class="nav-link" href="/scenic/list"><i class="bi bi-map me-1"></i>全部景点</a></li>
                <li class="nav-item"><a class="nav-link" href="/scenic/hot"><i class="bi bi-fire me-1"></i>热门推荐</a></li>
                <li class="nav-item"><a class="nav-link" href="/scenic/filter"><i class="bi bi-funnel me-1"></i>景点筛选</a></li>
                <li class="nav-item"><a class="nav-link" href="/scenic/search"><i class="bi bi-search me-1"></i>搜索</a></li>
            </ul>
            <div class="d-flex align-items-center" th:if="${session.user != null}">
                <a class="nav-link text-white me-3" href="/scenic/favorites">
                    <i class="bi bi-heart-fill text-danger me-1"></i>我的收藏
                </a>
                <div class="dropdown">
                    <a class="nav-link dropdown-toggle text-white d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1" style="font-size:1.3rem;"></i>
                        <span th:text="${session.user.nickname}">用户</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/user/profile"><i class="bi bi-gear me-2"></i>个人中心</a></li>
                        <li><a class="dropdown-item" href="/scenic/favorites"><i class="bi bi-heart me-2"></i>我的收藏</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="/user/logout"><i class="bi bi-box-arrow-right me-2"></i>退出登录</a></li>
                    </ul>
                </div>
            </div>
            <div class="d-flex" th:if="${session.user == null}">
                <a class="btn btn-login me-2" href="/user/login"><i class="bi bi-box-arrow-in-right me-1"></i>登录</a>
                <a class="btn btn-outline-light" href="/user/register" style="border-radius:20px;padding:6px 20px;">注册</a>
            </div>
        </div>
    </div>
</nav>

<!-- 页脚 -->
<footer th:fragment="footer" class="footer">
    <div class="container">
        <div class="row">
            <div class="col-md-4 mb-3">
                <h5 class="text-white"><i class="bi bi-globe-americas me-2" style="color:#f59e0b;"></i>畅游中国</h5>
                <p class="small">基于Java Web的旅行推荐网站<br>为您提供全国景点信息与个性化推荐服务</p>
            </div>
            <div class="col-md-4 mb-3">
                <h6 class="text-white">快速链接</h6>
                <ul class="list-unstyled small">
                    <li><a href="/">首页</a></li>
                    <li><a href="/scenic/list">全部景点</a></li>
                    <li><a href="/scenic/hot">热门推荐</a></li>
                    <li><a href="/scenic/filter">景点筛选</a></li>
                </ul>
            </div>
            <div class="col-md-4 mb-3">
                <h6 class="text-white">关于我们</h6>
                <p class="small">毕业设计项目 &copy; 2026<br>基于Spring Boot + MyBatis + Thymeleaf</p>
            </div>
        </div>
        <hr style="border-color: rgba(255,255,255,0.1);">
        <div class="text-center small">&copy; 2026 畅游中国旅行推荐网站 All Rights Reserved</div>
    </div>
</footer>

<!-- Scripts -->
<div th:fragment="scripts">
    <script src="https://unpkg.com/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/jquery@3.7.0/dist/jquery.min.js"></script>
</div>
</html>
