<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('用户登录 - 畅游中国')"></head>
<body>
<style>
    .login-page {
        min-height: 100vh;
        display: flex;
        background: #f0f4f8;
    }
    .login-carousel {
        flex: 1;
        position: relative;
        display: none;
    }
    @media(min-width: 992px) {
        .login-carousel { display: block; }
    }
    .login-carousel .carousel-item img {
        width: 100%;
        height: 100vh;
        object-fit: cover;
    }
    .login-carousel .carousel-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(135deg, rgba(30,58,95,0.7) 0%, rgba(37,99,235,0.5) 100%);
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        text-align: center;
    }
    .login-form-side {
        width: 480px;
        min-width: 380px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: #fff;
        box-shadow: -10px 0 40px rgba(0,0,0,0.08);
    }
    @media(max-width: 991px) {
        .login-form-side { width: 100%; min-width: unset; }
    }
    .login-card {
        width: 100%;
        max-width: 380px;
    }
    .login-card .form-control {
        border-radius: 12px;
        padding: 12px 16px;
        border: 2px solid #e2e8f0;
        font-size: 0.95rem;
    }
    .login-card .form-control:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .login-card .btn-login {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        border: none;
        border-radius: 12px;
        padding: 12px;
        font-weight: 700;
        font-size: 1.05rem;
        letter-spacing: 1px;
    }
    .login-card .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(37,99,235,0.4);
    }
    .carousel-caption-custom {
        position: relative;
        padding: 2rem;
    }
</style>

<div class="login-page">
    <!-- 左侧景点轮播 -->
    <div class="login-carousel">
        <div id="loginCarousel" class="carousel slide h-100" data-bs-ride="carousel" data-bs-interval="3500">
            <div class="carousel-inner h-100">
                <div class="carousel-item active h-100">
                    <img src="https://images.unsplash.com/photo-1508804185872-d7badad00f7d?w=1200&q=80" alt="故宫">
                </div>
                <div class="carousel-item h-100">
                    <img src="https://images.unsplash.com/photo-1547981609-4b6bfe67ca0b?w=1200&q=80" alt="长城">
                </div>
                <div class="carousel-item h-100">
                    <img src="https://images.unsplash.com/photo-1513415277900-a62401e19be4?w=1200&q=80" alt="桂林">
                </div>
                <div class="carousel-item h-100">
                    <img src="https://images.unsplash.com/photo-1474181628184-b4ffc94fa31f?w=1200&q=80" alt="山水">
                </div>
                <div class="carousel-item h-100">
                    <img src="https://images.unsplash.com/photo-1537531383496-f4749b04e0b4?w=1200&q=80" alt="西湖">
                </div>
            </div>
            <div class="carousel-overlay">
                <div class="carousel-caption-custom">
                    <h1 class="display-4 fw-bold mb-3">畅游中国</h1>
                    <p class="fs-5 mb-0" style="opacity:0.9;">发现中国之美 · 开启梦想之旅</p>
                    <div class="mt-4" style="opacity:0.7;">
                        <i class="bi bi-geo-alt-fill me-3 fs-4"></i>
                        <i class="bi bi-camera-fill me-3 fs-4"></i>
                        <i class="bi bi-compass-fill me-3 fs-4"></i>
                        <i class="bi bi-map-fill fs-4"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 右侧登录表单 -->
    <div class="login-form-side">
        <div class="login-card">
            <div class="text-center mb-4">
                <i class="bi bi-globe-americas" style="font-size:3rem;color:#2563eb;"></i>
                <h3 class="fw-bold mt-2" style="color:#1e293b;">欢迎回来</h3>
                <p class="text-muted">登录您的账号，开始探索之旅</p>
            </div>
            
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert" style="border-radius:12px;">
                <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert" style="border-radius:12px;">
                <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            
            <form action="/user/login" method="post">
                <input type="hidden" name="redirect" th:value="${redirect}">
                <div class="mb-3">
                    <label class="form-label fw-bold"><i class="bi bi-person me-1"></i>用户名</label>
                    <input type="text" name="username" class="form-control" placeholder="请输入用户名" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold"><i class="bi bi-lock me-1"></i>密码</label>
                    <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn btn-primary btn-login w-100 mb-3">
                    <i class="bi bi-box-arrow-in-right me-2"></i>登 录
                </button>
            </form>
            
            <div class="text-center mt-3">
                <span class="text-muted">还没有账号？</span>
                <a href="/user/register" class="fw-bold text-decoration-none" style="color:#2563eb;">立即注册</a>
            </div>
            <div class="text-center mt-2">
                <a href="/" class="text-muted text-decoration-none small">
                    <i class="bi bi-arrow-left me-1"></i>返回首页
                </a>
                <span class="text-muted mx-2">|</span>
                <a href="/admin/login" class="text-muted text-decoration-none small">
                    <i class="bi bi-shield-lock me-1"></i>管理员登录
                </a>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments/header :: scripts"></div>
</body>
</html>
