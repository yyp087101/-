# Server
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/travel_recommend?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.travel.entity
mybatis.configuration.map-underscore-to-camel-case=true

# Thymeleaf
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# Static resource performance
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# PageHelper
pagehelper.helper-dialect=mysql
pagehelper.reasonable=true
pagehelper.support-methods-arguments=true

# AMap (China mainland) APIs
amap.web.key=
amap.place.text.url=https://restapi.amap.com/v5/place/text
amap.place.around.url=https://restapi.amap.com/v5/place/around
amap.search.types=110000|110100|110101|110102|110103|110104|110200|110201|110202|110203|110204
amap.search.radius=10000
amap.default.city=长沙
amap.default.keyword=景点
amap.request.timeout-ms=8000

# Scenic image search
scenic.image.search.enabled=true
scenic.image.search.provider-url=https://cn.bing.com/images/search
scenic.image.search.timeout-ms=4500
scenic.image.search.max-candidates=3

# Local uploads
app.upload.base-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Tian API
tianapi.key=
tianapi.scenic.url=https://apis.tianapi.com/scenic/index

# Session
server.servlet.session.timeout=30m

# Logging
logging.level.com.travel.mapper=info
# Auto repair scenic text when legacy dumps contain "?" placeholders
app.scenic.auto-repair-corrupted-text=true
amap.geocode.url=https://restapi.amap.com/v3/geocode/geo
amap.direction.walking.url=https://restapi.amap.com/v3/direction/walking
amap.direction.riding.url=https://restapi.amap.com/v4/direction/bicycling
amap.direction.transit.url=https://restapi.amap.com/v3/direction/transit/integrated
amap.direction.driving.url=https://restapi.amap.com/v3/direction/driving
amap.direction.transit.strategy=0
# Free map routing fallback (no key required)
free.route.request.timeout-ms=3500
free.geocode.local.enabled=true
free.geocode.photon.enabled=false
free.geocode.photon.url=https://photon.komoot.io/api
free.geocode.nominatim.enabled=false
free.geocode.url=https://nominatim.openstreetmap.org/search
free.geocode.countrycodes=cn
free.route.osrm.url=https://router.project-osrm.org/route/v1
free.route.osrm.max-distance-km=600
