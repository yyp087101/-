<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 宠物领养</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="margin:0;padding:0">
<div class="auth-page">
    <!-- 左侧图片区 -->
    <div class="auth-left" style="background-image:url('/images/register-bg.jpg')">
        <div class="auth-left-content">
            <h2>开启一段<br>特别的缘分 🐱</h2>
            <p>注册后即可浏览所有待领养宠物，提交领养申请，并实时跟踪申请进度，让爱在这里延续。</p>
            <div style="display:flex;flex-direction:column;gap:12px">
                <div style="display:flex;align-items:center;gap:12px;color:rgba(255,255,255,0.85)">
                    <span style="font-size:20px">✅</span>
                    <span>免费注册，无任何隐藏费用</span>
                </div>
                <div style="display:flex;align-items:center;gap:12px;color:rgba(255,255,255,0.85)">
                    <span style="font-size:20px">✅</span>
                    <span>专业审核，确保领养安全负责</span>
                </div>
                <div style="display:flex;align-items:center;gap:12px;color:rgba(255,255,255,0.85)">
                    <span style="font-size:20px">✅</span>
                    <span>全程跟踪，领养前后全面服务</span>
                </div>
            </div>
        </div>
    </div>
    <!-- 右侧表单区 -->
    <div class="auth-right" style="overflow-y:auto">
        <div class="auth-form-wrap">
            <div class="auth-logo">
                <div class="logo-icon">🐾</div>
                <span class="logo-text">宠物领养</span>
            </div>
            <h2>创建新账号</h2>
            <p class="auth-sub">加入我们，给每只宠物一个温暖的家</p>

            <form id="registerForm" onsubmit="return doRegister()">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
                    <div class="form-group">
                        <label>👤 用户名 <span style="color:var(--danger)">*</span></label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="设置登录用户名" required>
                    </div>
                    <div class="form-group">
                        <label>📝 真实姓名</label>
                        <input type="text" class="form-control" id="realname" name="realname" placeholder="请输入姓名">
                    </div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
                    <div class="form-group">
                        <label>🔒 密码 <span style="color:var(--danger)">*</span></label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="至少6位密码" required>
                    </div>
                    <div class="form-group">
                        <label>🔒 确认密码 <span style="color:var(--danger)">*</span></label>
                        <input type="password" class="form-control" id="password2" placeholder="再次输入密码" required>
                    </div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
                    <div class="form-group">
                        <label>📱 手机号</label>
                        <input type="text" class="form-control" id="phone" name="phone" placeholder="请输入手机号">
                    </div>
                    <div class="form-group">
                        <label>📧 邮箱</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="请输入邮箱">
                    </div>
                </div>
                <div class="form-group" style="margin-top:8px">
                    <button type="submit" class="btn btn-primary btn-block btn-lg">🐾 立即注册，开始缘分</button>
                </div>
            </form>

            <div class="auth-footer">
                已有账号？<a th:href="@{/login}" style="color:var(--primary);font-weight:700">立即登录 →</a>
            </div>
            <div style="text-align:center;margin-top:12px">
                <a th:href="@{/index}" style="color:#bbb;font-size:13px">← 返回首页</a>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/common.js}"></script>
<script>
function doRegister() {
    var password = document.getElementById('password').value;
    var password2 = document.getElementById('password2').value;
    if (password !== password2) { showToast('两次密码输入不一致', 'error'); return false; }
    if (password.length < 6) { showToast('密码长度不能少于6位', 'error'); return false; }
    var data = {
        username: document.getElementById('username').value,
        password: password,
        realname: document.getElementById('realname').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value
    };
    ajaxPost('/doRegister', data, function(res) {
        if (res.code === 200) {
            showToast('注册成功！即将跳转登录页');
            setTimeout(function() { window.location.href = '/login'; }, 1500);
        } else {
            showToast(res.msg, 'error');
        }
    });
    return false;
}
</script>
</body>
</html>
