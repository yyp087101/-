<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 宠物领养</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="margin:0;padding:0">
<div class="auth-page">
    <!-- 左侧图片区 -->
    <div class="auth-left">
        <div class="auth-left-content">
            <h2>每只宠物<br>都值得被爱 🐾</h2>
            <p>加入宠物领养，与数百只可爱的毛孩子相遇，给它们一个温暖的家，也给自己一份特别的陪伴。</p>
            <div class="auth-pets-strip">
                <div class="pet-thumb">
                    <img src="/images/dog.jpg" alt="">
                </div>
                <div class="pet-thumb">
                    <img src="/images/cat.jpg" alt="">
                </div>
                <div class="pet-thumb">
                    <img src="/images/puppy.jpg" alt="">
                </div>
                <div class="pet-thumb">
                    <img src="/images/kitten.jpg" alt="">
                </div>
            </div>
        </div>
    </div>
    <!-- 右侧表单区 -->
    <div class="auth-right">
        <div class="auth-form-wrap">
            <div class="auth-logo">
                <div class="logo-icon">🐾</div>
                <span class="logo-text">宠物领养</span>
            </div>
            <h2>欢迎回来</h2>
            <p class="auth-sub">登录您的账号，继续探索等待您的毛孩子</p>

            <form id="loginForm" onsubmit="return doLogin()">
                <div class="form-group">
                    <label>👤 用户名</label>
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="请输入用户名" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>🔒 密码</label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="请输入密码" required autocomplete="current-password">
                </div>
                <div class="form-group" style="margin-top:28px">
                    <button type="submit" class="btn btn-primary btn-block btn-lg">🚀 立即登录</button>
                </div>
            </form>

            <div style="position:relative;text-align:center;margin:20px 0">
                <hr style="border-color:#eee">
                <span style="position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--bg);padding:0 12px;color:#bbb;font-size:13px">或者</span>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                <div style="background:#fff8f3;border:2px solid var(--border);border-radius:10px;padding:14px;text-align:center">
                    <div style="font-size:24px">🐶</div>
                    <div style="font-size:12px;color:#666;margin-top:4px">200+ 宠物等你</div>
                </div>
                <div style="background:#f0fff8;border:2px solid var(--border);border-radius:10px;padding:14px;text-align:center">
                    <div style="font-size:24px">❤️</div>
                    <div style="font-size:12px;color:#666;margin-top:4px">100+ 成功领养</div>
                </div>
            </div>

            <div class="auth-footer">
                还没有账号？<a th:href="@{/register}" style="color:var(--primary);font-weight:700">免费注册 →</a>
            </div>
            <div style="text-align:center;margin-top:12px">
                <a th:href="@{/index}" style="color:#bbb;font-size:13px">← 返回首页</a>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/common.js}"></script>
<script>
function doLogin() {
    var username = document.getElementById('username').value;
    var password = document.getElementById('password').value;
    if (!username || !password) { showToast('请填写完整信息', 'error'); return false; }
    ajaxPost('/doLogin', {username: username, password: password}, function(res) {
        if (res.code === 200) {
            showToast('登录成功，欢迎回来！');
            setTimeout(function() {
                window.location.href = res.data.role === 1 ? '/admin/index' : '/index';
            }, 600);
        } else {
            showToast(res.msg, 'error');
        }
    });
    return false;
}
</script>
</body>
</html>
