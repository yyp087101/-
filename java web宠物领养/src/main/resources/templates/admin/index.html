<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="common/header :: head('管理后台 - 宠物领养')"></head>
<body>
<nav th:replace="common/header :: admin-navbar"></nav>
<div class="admin-layout">
    <aside th:replace="common/header :: admin-sidebar"></aside>
    <main class="admin-main">
        <!-- 欢迎条 -->
        <div class="admin-notice-bar">
            👋 欢迎回来，<strong th:text="${session.loginUser.realname}"></strong>！今天也请继续为毛孩子们守护爱的桥梁 🐾
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon" style="background:linear-gradient(135deg,#4361EE,#2c47c5)">👥</div>
                <div class="stat-info">
                    <div class="stat-value" th:text="${stats.userCount}">0</div>
                    <div class="stat-label">注册用户</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background:linear-gradient(135deg,#FF6B35,#E55520)">🐾</div>
                <div class="stat-info">
                    <div class="stat-value" th:text="${stats.petCount}">0</div>
                    <div class="stat-label">宠物总数</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background:linear-gradient(135deg,#52B788,#3a9e6a)">❤️</div>
                <div class="stat-info">
                    <div class="stat-value" th:text="${stats.adoptedCount}">0</div>
                    <div class="stat-label">已成功领养</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background:linear-gradient(135deg,#FFB800,#e0a200)">📋</div>
                <div class="stat-info">
                    <div class="stat-value" th:text="${stats.pendingCount}">0</div>
                    <div class="stat-label">待审核申请</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background:linear-gradient(135deg,#2EC4B6,#1ea99e)">📢</div>
                <div class="stat-info">
                    <div class="stat-value" th:text="${stats.noticeCount}">0</div>
                    <div class="stat-label">公告数量</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background:linear-gradient(135deg,#6f42c1,#4e2d8b)">💬</div>
                <div class="stat-info">
                    <div class="stat-value" th:text="${stats.feedbackCount}">0</div>
                    <div class="stat-label">用户反馈</div>
                </div>
            </div>
        </div>

        <!-- 快捷操作 + 待审核提示 -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
            <div class="card">
                <div class="card-header">⚡ 快捷操作</div>
                <div class="card-body">
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                        <a th:href="@{/admin/pet/add}" class="btn btn-primary" style="justify-content:center;padding:14px">
                            <span style="font-size:18px">🐾</span> 添加宠物
                        </a>
                        <a th:href="@{/admin/adoption/list}" class="btn btn-warning" style="justify-content:center;padding:14px">
                            <span style="font-size:18px">📋</span> 审核申请
                        </a>
                        <a th:href="@{/admin/notice/add}" class="btn btn-info" style="justify-content:center;padding:14px">
                            <span style="font-size:18px">📢</span> 发布公告
                        </a>
                        <a th:href="@{/admin/user/list}" class="btn btn-success" style="justify-content:center;padding:14px">
                            <span style="font-size:18px">👥</span> 管理用户
                        </a>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">📊 数据概况</div>
                <div class="card-body">
                    <div>
                        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f5f5f5">
                            <span style="color:#666;font-size:14px">🐶 待领养宠物</span>
                            <span style="font-weight:700;color:var(--primary)" th:text="${stats.petCount - stats.adoptedCount} + ' 只'">0 只</span>
                        </div>
                        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f5f5f5">
                            <span style="color:#666;font-size:14px">⏳ 待处理申请</span>
                            <span style="font-weight:700;color:var(--warning)" th:text="${stats.pendingCount} + ' 条'">0 条</span>
                        </div>
                        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f5f5f5">
                            <span style="color:#666;font-size:14px">✅ 领养成功率</span>
                            <span style="font-weight:700;color:var(--success)"
                                  th:text="${stats.petCount > 0} ? ${#numbers.formatDecimal(stats.adoptedCount * 100.0 / stats.petCount, 1, 1)} + '%' : '0%'">0%</span>
                        </div>
                        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0">
                            <span style="color:#666;font-size:14px">👤 活跃用户</span>
                            <span style="font-weight:700;color:var(--info)" th:text="${stats.userCount} + ' 人'">0 人</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
